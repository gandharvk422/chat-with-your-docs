services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: chatdocs-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      HF_HOME: /root/.cache/huggingface

    volumes:
      - hf_cache:/root/.cache/huggingface

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: chatdocs-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  hf_cache: